<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="Explore beautiful destinations in Sierra Leone - pristine beaches, historic sites, and cultural attractions in Freetown and beyond.">
  <meta name="keywords" content="destinations, Sierra Leone, beaches, tourism, travel spots, Freetown, attractions">
  <meta name="author" content="Visit Freetown Tourism">
  <meta name="robots" content="index, follow">
  
  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="Destinations - Visit Freetown Tourism">
  <meta property="og:description" content="Discover beautiful destinations in Sierra Leone - beaches, historic sites, and cultural attractions">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://visitfreetown.com/destinations.html">
  <meta property="og:image" content="./images/Background-image.png">
  
  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Destinations - Visit Freetown">
  <meta name="twitter:description" content="Explore Sierra Leone's beautiful destinations">
  
  <title>Destinations - Visit Freetown Tourism</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="./images/logo.png">
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="./css/styles.css">
  
  <!-- Bootstrap JS Bundle (includes Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
  
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Custom JS -->
  <script src="./js/main.js" defer></script>
  <script src="./js/maps.js" defer></script>
  <script src="./js/destinations.js" defer></script>
</head>
<body>
  <!-- Navbar Placeholder -->
  <div id="navbar-placeholder"></div>
  
  <!-- Hero Placeholder -->
  <div id="hero-placeholder"></div>
  
  <!-- Filter Section -->
  <section class="py-4 bg-white border-bottom">
    <div class="container">
      <div class="d-flex flex-wrap gap-2 justify-content-center">
        <button class="btn btn-outline-success filter-btn active" data-filter="all">
          <i class="fas fa-globe me-2"></i>All Destinations
        </button>
        <button class="btn btn-outline-success filter-btn" data-filter="beach">
          <i class="fas fa-umbrella-beach me-2"></i>Beaches
        </button>
        <button class="btn btn-outline-success filter-btn" data-filter="historic">
          <i class="fas fa-landmark me-2"></i>Historic Sites
        </button>
        <button class="btn btn-outline-success filter-btn" data-filter="nature">
          <i class="fas fa-mountain me-2"></i>Nature
        </button>
        <button class="btn btn-outline-success filter-btn" data-filter="dining">
          <i class="fas fa-utensils me-2"></i>Dining
        </button>
        <button class="btn btn-outline-success filter-btn" data-filter="accommodation">
          <i class="fas fa-hotel me-2"></i>Accommodation
        </button>
      </div>
    </div>
  </section>
  
  <!-- Map Section -->
  <section class="py-5 bg-white">
    <div class="container">
      <div class="text-center mb-4">
        <h2 class="fw-bold text-success mb-2">
          <i class="fas fa-map-marked-alt me-2"></i>Explore Destinations Map
        </h2>
        <p class="text-muted">Interactive map showing popular attractions in Freetown</p>
      </div>
      <div id="destination-map" style="height: 500px; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1);"></div>
    </div>
  </section>
  
  <!-- Destinations Grid -->
  <section class="py-5 bg-light">
    <div class="container">
      <div class="row" id="destinations-container">
        <!-- Destinations will be rendered here by JavaScript -->
      </div>
    </div>
  </section>
  
  <!-- Footer Placeholder -->
  <div id="footer-placeholder"></div>
  
  <!-- Destination Detail Modal -->
  <div class="modal fade" id="destinationModal" tabindex="-1" aria-labelledby="destinationModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="destinationModalLabel">Destination Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="row">
            <div class="col-md-6">
              <img id="modal-image" src="" alt="Destination" class="img-fluid rounded mb-3" style="width: 100%; height: 300px; object-fit: cover;">
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <span id="modal-badge" class="badge rounded-pill px-3 py-2"></span>
              </div>
              <h4 id="modal-name" class="fw-bold text-primary mb-2"></h4>
              <p class="text-muted mb-2">
                <i class="fas fa-map-marker-alt text-success me-2"></i><span id="modal-location"></span>
              </p>
              <div class="mb-2">
                <i class="fas fa-star text-warning"></i>
                <span class="fw-bold" id="modal-rating"></span>
              </div>
              <div class="mb-3">
                <strong>Features:</strong>
                <div id="modal-features" class="mt-2"></div>
              </div>
            </div>
          </div>
          <hr>
          <div class="row mt-3">
            <div class="col-md-4">
              <div class="mb-3">
                <strong><i class="fas fa-calendar text-success me-2"></i>Best Time to Visit:</strong>
                <p id="modal-best-time" class="text-muted small mt-1"></p>
              </div>
            </div>
            <div class="col-md-4">
              <div class="mb-3">
                <strong><i class="fas fa-route text-primary me-2"></i>How to Get There:</strong>
                <p id="modal-how-to-get" class="text-muted small mt-1"></p>
              </div>
            </div>
            <div class="col-md-4">
              <div class="mb-3">
                <strong><i class="fas fa-ticket-alt text-warning me-2"></i>Entry Fee:</strong>
                <p id="modal-entry-fee" class="text-muted small mt-1"></p>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-md-6">
              <div class="mb-3">
                <strong><i class="fas fa-clock text-info me-2"></i>Opening Hours:</strong>
                <p id="modal-opening-hours" class="text-muted small mt-1"></p>
              </div>
            </div>
          </div>
          <div class="mt-3">
            <strong><i class="fas fa-info-circle text-primary me-2"></i>About:</strong>
            <p id="modal-full-description" class="text-muted mt-2"></p>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-success" onclick="addToWishlistFromModal()">
            <i class="fas fa-heart me-2"></i>Add to Wishlist
          </button>
        </div>
      </div>
    </div>
  </div>
  
</html>
