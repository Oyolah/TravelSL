<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="Find the best hotels and resorts in Sierra Leone - luxury accommodations, beach resorts, and comfortable stays in Freetown and beyond.">
  <meta name="keywords" content="hotels, resorts, accommodation, Sierra Leone, Freetown, beach hotels, luxury stays">
  <meta name="author" content="Visit Freetown Tourism">
  <meta name="robots" content="index, follow">
  
  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="Hotels & Resorts - Visit Freetown Tourism">
  <meta property="og:description" content="Discover the best hotels and resorts in Sierra Leone for your perfect stay">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://visitfreetown.com/accommodation.html">
  <meta property="og:image" content="./images/backgrounds/Background-image.png">
  
  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Hotels & Resorts - Visit Freetown">
  <meta name="twitter:description" content="Find perfect accommodation in Sierra Leone">
  
  <title>Hotels & Resorts - Visit Freetown Tourism</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="./images/logo.png">
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="./css/styles.css">
  
  <!-- Bootstrap JS Bundle (includes Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
  
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Custom JS -->
  <script src="./js/main.js" defer></script>
  <script src="./js/maps.js" defer></script>
  <script src="./js/accommodation.js" defer></script>
</head>
<body>
  <!-- Navbar Placeholder -->
  <div id="navbar-placeholder"></div>
  
  <!-- Hero Placeholder -->
  <div id="hero-placeholder"></div>
  
  <!-- Filter Section -->
  <section class="py-4 bg-white border-bottom">
    <div class="container">
      <div class="d-flex flex-wrap gap-2 justify-content-center">
        <button class="btn btn-outline-success filter-btn active" data-filter="all">
          <i class="fas fa-hotel me-2"></i>All Hotels
        </button>
        <button class="btn btn-outline-success filter-btn" data-filter="I">
          <i class="fas fa-star me-2"></i>Category I
        </button>
        <button class="btn btn-outline-success filter-btn" data-filter="II">
          <i class="fas fa-star-half-alt me-2"></i>Category II
        </button>
        <button class="btn btn-outline-success filter-btn" data-filter="III">
          <i class="fas fa-star me-2"></i>Category III
        </button>
        <button class="btn btn-outline-success filter-btn" data-filter="IV">
          <i class="fas fa-star me-2"></i>Category IV
        </button>
      </div>
    </div>
  </section>
  
  <!-- Map Section -->
  <section class="py-5 bg-white">
    <div class="container">
      <div class="text-center mb-4">
        <h2 class="fw-bold text-success mb-2">
          <i class="fas fa-map-marked-alt me-2"></i>Hotel Locations
        </h2>
        <p class="text-muted">Find hotels on the map across Freetown</p>
      </div>
      <div id="accommodation-map" style="height: 500px; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1);"></div>
    </div>
  </section>
  
  <!-- Hotels Grid -->
  <section class="py-5 bg-light">
    <div class="container">
      <div class="row" id="hotels-container">
        <!-- Hotels will be rendered here by JavaScript -->
      </div>
    </div>
  </section>
  
  <!-- Footer Placeholder -->
  <div id="footer-placeholder"></div>
  
</html>
