<!-- Reusable Hero Component -->
<section class="hero-section">
  <div id="heroCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="5000">
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="0" class="active"></button>
      <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="1"></button>
      <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="2"></button>
      <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="3"></button>
    </div>
    <div class="carousel-inner">
      <div class="carousel-item active" style="background: url('./images/destinations/bureh-beach.jpg') center/cover no-repeat;">
        <div class="hero-overlay position-absolute top-0 start-0 w-100 h-100"></div>
        <div class="hero-content position-relative d-flex flex-column align-items-center justify-content-center text-white text-center">
          <div class="container">
            <h1 class="hero-title fw-bold mb-3" id="hero-title">Page Title</h1>
            <p class="hero-subtitle mb-0" id="hero-subtitle">Page subtitle goes here</p>
          </div>
        </div>
      </div>
      <div class="carousel-item" style="background: url('./images/destinations/river-no-2-beach.jpg') center/cover no-repeat;">
        <div class="hero-overlay position-absolute top-0 start-0 w-100 h-100"></div>
        <div class="hero-content position-relative d-flex flex-column align-items-center justify-content-center text-white text-center">
          <div class="container">
            <h1 class="hero-title fw-bold mb-3">River No.2 Beach</h1>
            <p class="hero-subtitle mb-0">Experience one of Sierra Leone's most pristine beaches</p>
          </div>
        </div>
      </div>
      <div class="carousel-item" style="background: url('./images/destinations/leicester-peak.jpg') center/cover no-repeat;">
        <div class="hero-overlay position-absolute top-0 start-0 w-100 h-100"></div>
        <div class="hero-content position-relative d-flex flex-column align-items-center justify-content-center text-white text-center">
          <div class="container">
            <h1 class="hero-title fw-bold mb-3">Leicester Peak</h1>
            <p class="hero-subtitle mb-0">Hike to the highest point in Freetown for breathtaking views</p>
          </div>
        </div>
      </div>
      <div class="carousel-item" style="background: url('./images/destinations/parliament-building.jpg') center/cover no-repeat;">
        <div class="hero-overlay position-absolute top-0 start-0 w-100 h-100"></div>
        <div class="hero-content position-relative d-flex flex-column align-items-center justify-content-center text-white text-center">
          <div class="container">
            <h1 class="hero-title fw-bold mb-3">Sierra Leone Parliament</h1>
            <p class="hero-subtitle mb-0">Discover the historic government building and Freetown's political heritage</p>
          </div>
        </div>
      </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>
  </div>
</section>
