<!-- Reusable Hero Component -->
<section class="hero-section">
  <div id="heroCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="5000">
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="0" class="active"></button>
      <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="1"></button>
      <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="2"></button>
      <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="3"></button>
    </div>
    <div class="carousel-inner">
      <div class="carousel-item active" style="background: url('./images/Sierra-leone-img/Bureh-2_SLTB.jpg') center/cover no-repeat;">
        <div class="hero-overlay"></div>
        <div class="hero-content">
          <div class="container">
            <div class="row">
              <div class="col-12 text-center">
                <h1 class="hero-title" id="hero-title">Page Title</h1>
                <p class="hero-subtitle" id="hero-subtitle">Page subtitle goes here</p>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="carousel-item" style="background: url('./images/Sierra-leone-img/River-No2-Village-Beach-Sierra-Leone.jpg') center/cover no-repeat;">
        <div class="hero-overlay"></div>
        <div class="hero-content">
          <div class="container">
            <div class="row">
              <div class="col-12 text-center">
                <h1 class="hero-title">River No.2 Beach</h1>
                <p class="hero-subtitle">Experience one of Sierra Leone's most pristine beaches</p>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="carousel-item" style="background: url('./images/Sierra-leone-img/leicester peak mountain.jpg') center/cover no-repeat;">
        <div class="hero-overlay"></div>
        <div class="hero-content">
          <div class="container">
            <div class="row">
              <div class="col-12 text-center">
                <h1 class="hero-title">Leicester Peak</h1>
                <p class="hero-subtitle">Hike to the highest point in Freetown for breathtaking views</p>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="carousel-item" style="background: url('./images/Sierra-leone-img/ma-degn-beach-festival-1.webp') center/cover no-repeat;">
        <div class="hero-overlay"></div>
        <div class="hero-content">
          <div class="container">
            <div class="row">
              <div class="col-12 text-center">
                <h1 class="hero-title">Beach Festivals</h1>
                <p class="hero-subtitle">Join the vibrant beach culture and festivals of Sierra Leone</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>
  </div>
</section>
