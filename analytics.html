<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="View task analytics and travel statistics for Sierra Leone tourism. Track your travel planning progress with visual charts and insights.">
  <meta name="keywords" content="analytics, dashboard, statistics, Sierra Leone tourism, task tracking, travel planning">
  <meta name="author" content="Visit Freetown Tourism">
  <meta name="robots" content="index, follow">
  
  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="Analytics - Visit Freetown Tourism">
  <meta property="og:description" content="View task analytics and travel statistics for your Sierra Leone trip planning">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://visitfreetown.com/analytics.html">
  <meta property="og:image" content="./images/Background-image.png">
  
  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Analytics - Visit Freetown">
  <meta name="twitter:description" content="Track your Sierra Leone travel planning with analytics">
  
  <title>Analytics - Visit Freetown Tourism</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="./images/logo.png">
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" defer></script>
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="./css/styles.css">
  
  <!-- Bootstrap JS Bundle (includes Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
  
  <!-- Custom JS -->
  <script src="./js/main.js" defer></script>
  <script src="./js/itinerary.js" defer></script>
</head>
<body>
  <!-- Navbar Placeholder -->
  <div id="navbar-placeholder"></div>
  
  <!-- Hero Placeholder -->
  <div id="hero-placeholder"></div>
  
  <main>
    <section class="py-5">
      <div class="container">
        <div class="text-center mb-5">
          <h2 class="section-title">My Itinerary</h2>
          <p class="lead">Plan your perfect Sierra Leone adventure day by day</p>
        </div>
        
        <!-- Itinerary Controls -->
        <div class="row mb-4">
          <div class="col-md-8">
            <div class="input-group">
              <input type="text" class="form-control" id="itinerary-name" placeholder="Itinerary Name" onchange="updateItineraryName()">
              <button class="btn btn-success" onclick="createNewItinerary()">
                <i class="fas fa-plus me-2"></i>New
              </button>
            </div>
          </div>
        </div>
        
        <!-- Itinerary List -->
        <div class="row mb-4">
          <div class="col-12">
            <div class="card">
              <div class="card-header bg-light">
                <h6 class="mb-0"><i class="fas fa-list me-2"></i>My Itineraries</h6>
              </div>
              <div class="card-body">
                <div id="itinerary-list">
                  <!-- Itineraries will be rendered here -->
                </div>
              </div>
            </div>
          </div>
        </div>
        
        <!-- Days Container -->
        <div id="days-container">
          <!-- Days will be rendered here -->
        </div>
        
        <!-- Add Day Button -->
        <div class="text-center mt-4">
          <button class="btn btn-outline-success btn-lg" onclick="addDay()">
            <i class="fas fa-calendar-plus me-2"></i>Add Day
          </button>
        </div>
      </div>
    </section>
  </main>
  
  <!-- Footer Placeholder -->
  <div id="footer-placeholder"></div>
</html>
